[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-mcp-servers"
version = "0.1.0"
description = "MCP servers for archi deployments."
requires-python = ">=3.10"
dependencies = ["mcp"]

[tool.setuptools]
packages = ["remote_diagnostic"]

[tool.setuptools.package-data]
remote_diagnostic = ["config.example.json"]
